<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Selamat Ulang Tahun 🎉</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(
          135deg,
          #1e3c72,
          #2a5298
        ); /* biru gradasi */
        color: #fff;
        text-align: center;
      }
      .card {
        background: rgba(255, 255, 255, 0.1);
        padding: 40px 30px;
        border-radius: 20px;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        animation: fadeIn 1.5s ease;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 15px;
        color: #e0f0ff; /* biru muda lembut */
      }
      p {
        font-size: 20px;
        line-height: 1.6;
        color: #f5faff;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Selamat Ulang Tahun, Vita! 🎂✨</h1>
      <p>
        Hari ini kamu resmi menginjak usia <b>21 tahun</b> 💙<br /><br />
        Semoga setiap langkahmu penuh kebahagiaan, panjang umur, sehat selalu,
        dan semua mimpi indahmu tercapai 🌟💫<br /><br />
        Kamu layak mendapatkan yang terbaik, sekarang dan selamanya ❤️
      </p>
    </div>
  </body>
</html>
