<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Landing Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0d0d0d;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Background blur warna */
    .bg-gradient {
        position: fixed;
        inset: 0;
        background: linear-gradient(120deg, #ff2d55, #8855ff, #00d4ff, #ffb300);
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
        z-index: -3;
        filter: blur(60px);
        opacity: 0.7;
    }

    @keyframes gradientMove {
        0% { background-position: 0 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0 50%; }
    }

    /* Card */
    .card {
      padding: 40px 55px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255,255,255,0.15);
      text-align: center;
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    h1 {
      font-size: 2.2rem;
      color: #fff;
      margin-bottom: 18px;
      text-shadow: 0 0 25px #fff;
    }

    p {
      color: #e8e8e8;
      margin-bottom: 28px;
      font-size: 1.1rem;
    }

    /* Tombol tengah */
    .btn {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: linear-gradient(180deg, #5bb7ff, #0077ff);
      color: white;
      box-shadow: 0 0 15px rgba(0, 132, 255, 0.5);
      transition: 0.2s;
    }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 0 25px rgba(0, 132, 255, 0.8);
    }
  </style>
</head>
<body>

  <div class="bg-gradient"></div>

  <div class="card">
    <h1>Selamat Datang Manusia Cantikk </h1>
    <p>Hallo Vita Setiyani, Halaman berikutnya aku buat khusus buat Vita</p>
    <button class="btn"><a href="index.html">Sentuh Akuu</a></Sentuh></button>
  </div>

</body>
</html>
